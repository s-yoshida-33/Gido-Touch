name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          $version = (Get-Content package.json | Select-String '"version": "([^"]*)"' | ForEach-Object { $_.Matches.Groups[1].Value })
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build signed release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:release

      - name: List release artifacts
        run: Get-ChildItem -Path release -File | Format-Table Name, Length

      - name: Download existing S3 artifacts for archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          S3_PREFIX="public/gido-touch/releases"
          mkdir -p s3-archive
          echo "Downloading existing S3 artifacts for archive..."
          aws s3 sync "s3://${S3_BUCKET}/${S3_PREFIX}/" s3-archive/ --exclude "latest.json" || echo "No existing artifacts found (first release)"
          ls -la s3-archive/ || echo "Archive directory is empty"

      - name: Upload S3 archive as workflow artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: s3-archive-before-v${{ steps.get_version.outputs.version }}
          path: s3-archive/
          if-no-files-found: ignore
          retention-days: 90

      - name: Clean up old artifacts from S3
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          S3_PREFIX="public/gido-touch/releases"
          echo "Cleaning up old versioned artifacts from S3 (keeping latest.json)..."
          aws s3 rm "s3://${S3_BUCKET}/${S3_PREFIX}/" --recursive --exclude "latest.json" || echo "No existing artifacts to clean up"
          echo "S3 cleanup complete."

      - name: Upload artifacts to S3
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          S3_PREFIX="public/gido-touch/releases"

          echo "Uploading release artifacts to s3://${S3_BUCKET}/${S3_PREFIX}/"

          # Upload installer (.exe)
          aws s3 cp \
            "release/GidoTouchSetup-x64-${VERSION}.exe" \
            "s3://${S3_BUCKET}/${S3_PREFIX}/GidoTouchSetup-x64-${VERSION}.exe" \
            --content-type "application/octet-stream"

          # Upload signature (.exe.sig)
          aws s3 cp \
            "release/GidoTouchSetup-x64-${VERSION}.exe.sig" \
            "s3://${S3_BUCKET}/${S3_PREFIX}/GidoTouchSetup-x64-${VERSION}.exe.sig" \
            --content-type "text/plain"

          # Upload latest.json (no-cache: apps must always get the latest version)
          aws s3 cp \
            "release/latest.json" \
            "s3://${S3_BUCKET}/${S3_PREFIX}/latest.json" \
            --content-type "application/json" \
            --cache-control "no-cache, max-age=0"

          echo "Upload complete."
          echo "  https://dl.tti.ninja/${S3_PREFIX}/GidoTouchSetup-x64-${VERSION}.exe"
          echo "  https://dl.tti.ninja/${S3_PREFIX}/GidoTouchSetup-x64-${VERSION}.exe.sig"
          echo "  https://dl.tti.ninja/${S3_PREFIX}/latest.json"

      - name: Create GitHub Release (changelog only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          name: "Release v${{ steps.get_version.outputs.version }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [build]
    runs-on: windows-latest
    if: always()
    steps:
      - name: Release build complete
        run: |
          if ("${{ needs.build.result }}" -eq "success") {
            Write-Output "[+] Build completed successfully"
            Write-Output "[+] Release version: ${{ needs.build.outputs.release_version }}"
          } else {
            Write-Output "[-] Build failed"
            exit 1
          }
